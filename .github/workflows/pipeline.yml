name: CI/CD Pipeline Python

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Instalar dependências e Monitor Virtual (xvfb)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb
        pip install customtkinter
        
    - name: Rodar Testes Unitários
      run: |
        xvfb-run -a python -m unittest test_calculadora.py

    - name: Enviar Alerta para o Discord
      if: always()
      run: |
        curl -H "Content-Type: application/json" \
        -d "{\"content\": \"🤖 Alerta do GitHub Actions! O Pipeline da Calculadora acabou de rodar. Status final da rotina: ${{ job.status }}\"}" \
        ${{ secrets.DISCORD_WEBHOOK }}