name: CI/CD Pipeline Python

# Executa quando houver Pull Request ou Push para a main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # FASE DE CI: Integração Contínua (Qualidade do Código)
  # ----------------------------------------------------
  Continuous-Integration:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar o código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Checagem de Qualidade (Linting com Flake8)
      run: |
        # Para a execução se houver erros graves de sintaxe
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Gera avisos para o resto, mas não reprova a PR
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ----------------------------------------------------
  # FASE DE CD: Entrega Contínua (Gerar o .exe do Windows)
  # ----------------------------------------------------
  Continuous-Delivery:
    needs: Continuous-Integration # Só roda se o CI passar
    runs-on: windows-latest       # Roda num Windows para gerar o .exe
    steps:
    - name: Baixar o código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Construir o Executável (PyInstaller)
      run: |
        pyinstaller --noconfirm --onefile --windowed calculadora.py

    - name: Disponibilizar o .exe para Download
      uses: actions/upload-artifact@v3
      with:
        name: Calculadora-Executavel
        path: dist/calculadora.exe